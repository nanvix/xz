name: Nanvix CI

on:
    schedule:
        - cron: "0 9 * * *"
    push:
        branches: ["nanvix/**"]
    pull_request:
        branches: ["nanvix/**"]
    workflow_dispatch:

permissions:
    contents: write
    actions: write
    issues: write
    pull-requests: write
    packages: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name || github.ref || 'default' }}
    cancel-in-progress: true

jobs:
    ci:
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v2.0.1
        with:
            zutil-version: "v0.9.1"
            platforms: '["microvm"]'
            process-modes: '["multi-process","single-process","standalone"]'
            memory-sizes: '["128mb","256mb"]'
            windows-matrix-exclude: '[]'
            skip-full-test-modes: '[]'
            caller-event-name: ${{ github.event_name }}
            windows-test: true
            docker-image: "ghcr.io/nanvix/toolchain-gcc:sha-34a3641" # yamllint disable-line rule:line-length
        secrets:
            GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
            DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

    ci-scheduled:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v2.0.1
        with:
            zutil-version: "v0.9.1"
            platforms: '["microvm"]'
            process-modes: '["multi-process","single-process","standalone"]'
            memory-sizes: '["128mb","256mb"]'
            windows-matrix-exclude: '[]'
            skip-full-test-modes: '[]'
            caller-event-name: 'schedule'
            windows-test: true
            docker-image: "ghcr.io/nanvix/toolchain-gcc:sha-34a3641" # yamllint disable-line rule:line-length
        secrets:
            GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
            DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
