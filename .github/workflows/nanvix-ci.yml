name: Nanvix CI

on:
    schedule:
        - cron: "0 9 * * *"
    push:
        branches: ["nanvix/**"]
    pull_request:
        branches: ["nanvix/**"]
    workflow_dispatch:

permissions:
    contents: write
    actions: write
    issues: write
    pull-requests: write
    packages: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name || github.ref || 'default' }}
    cancel-in-progress: true

jobs:
    ci:
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v2.6.0
        with:
            platforms: '["microvm"]'
            process-modes: '["standalone"]'
            memory-sizes: '["256mb"]'
            windows-matrix-exclude: '[]'
            skip-full-test-modes: '[]'
            caller-event-name: ${{ github.event_name }}
            windows-test: true
            docker-image: >-
                ghcr.io/nanvix/nanvix-sdk-c-clang@sha256:f61737cb0780e6a2058c6d0bdf8ae5562db18de437173b2bcbbe6973abd3689f
        secrets:
            GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
            DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

    ci-scheduled:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: nanvix/workflows/.github/workflows/nanvix-ci.yml@v2.6.0
        with:
            platforms: '["microvm"]'
            process-modes: '["standalone"]'
            memory-sizes: '["256mb"]'
            windows-matrix-exclude: '[]'
            skip-full-test-modes: '[]'
            caller-event-name: 'schedule'
            windows-test: true
            docker-image: >-
                ghcr.io/nanvix/nanvix-sdk-c-clang@sha256:f61737cb0780e6a2058c6d0bdf8ae5562db18de437173b2bcbbe6973abd3689f
        secrets:
            GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
            DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
